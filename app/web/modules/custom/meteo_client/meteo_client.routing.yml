meteo_client.today:
  path: '/weather/today/{place}'
  defaults:
    _controller: '\Drupal\meteo_client\Controller\WeatherController::today'
    _title: 'Today''s weather'
    place: 'vilnius'
  requirements:
    _permission: 'access content'

meteo_client.search:
  path: '/weather'
  defaults:
    _form: '\Drupal\meteo_client\Form\WeatherSearchForm'
    _title: 'Weather search'
  requirements:
    _permission: 'access content'
