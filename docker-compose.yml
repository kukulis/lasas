networks:
    lasas-network:
        name: lasas-network
        external: true

services:
    lasas:
        image: darbelis/lasas:latest
        container_name: lasas
        build:
            context: ./
            dockerfile: .docker/app/Dockerfile
        volumes:
            - ./:/var/www/html
            - ./shared:/var/shared
            - ./xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
            - ./.docker/app/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
        environment:
            BASEDIR: /var/www/html
#            COMPOSER_AUTH: '${COMPOSER_AUTH}'
            HOME: /var/www/html
            PHP_IDE_CONFIG: 'serverName=lasas.dv'
        networks:
            - lasas-network

    lasas_web:
        image: darbelis/lasas_web:latest
        container_name: lasas_web
        build:
            context: ./
            dockerfile: .docker/web/Dockerfile
        links:
            - lasas:php_fpm
        ports:
            - "7088:80"
        environment:
            - BASEDIR=/var/www/html

        volumes:
            - ./.docker/web/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
            - ./:/var/www/html
            - ./shared:/var/shared

        networks:
            - lasas-network

        depends_on:
            - lasas

    lasas_db:
        image: mariadb:11.5
        container_name: lasas_db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_DATABASE: lasas_db
            MYSQL_USER: lasas
            MYSQL_PASSWORD: lasas_password
        ports:
            - "33310:3306"
        volumes:
            - lasas_db_data:/var/lib/mysql
            - ./.docker/db/conf.d:/etc/mysql/conf.d
        networks:
            - lasas-network
        healthcheck:
            test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 30s

volumes:
    lasas_db_data:
